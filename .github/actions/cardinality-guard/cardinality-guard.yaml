# Regex patterns for label names that produce unbounded cardinality.
# Each unique value creates a new Prometheus time series — at scale this
# causes OOM crashes. Patterns are case-insensitive and match substrings.
blocked_label_patterns:
  - "user_?id"
  - "request_?id"
  - "session_?id"
  - "trace_?id"
  - "order_?id"
  - "transaction_?id"
  - "ip_?address"
  - "email"
  - "token"
  - "uuid"
  - "filename"
  - "query"
