name: Cardinality Guard
description: >
  Scans Python source files for Prometheus metric definitions with
  high-cardinality label names and fails the build if any are found.
  Catches series explosion before it reaches production.

inputs:
  scan-path:
    description: Directory to scan
    default: "."
  config-file:
    description: Path to cardinality-guard.yaml config
    default: ".github/actions/cardinality-guard/cardinality-guard.yaml"

runs:
  using: composite
  steps:
    - name: Scan metric definitions for high-cardinality labels
      shell: python
      run: |
        import ast, re, sys, yaml, pathlib

        config_path = "${{ inputs.config-file }}"
        scan_path   = "${{ inputs.scan-path }}"

        with open(config_path) as f:
            config = yaml.safe_load(f)

        # Compile regex patterns — catches variants like user_id, userid, userId
        blocked_patterns = [
            re.compile(p, re.IGNORECASE)
            for p in config.get("blocked_label_patterns", [])
        ]

        METRIC_CLASSES = {"Counter", "Gauge", "Histogram", "Summary"}

        class CardinalityChecker(ast.NodeVisitor):
            def __init__(self):
                self.violations = []

            def visit_Call(self, node):
                func_name = (
                    getattr(node.func, "id", None) or
                    getattr(node.func, "attr", None)
                )
                if func_name not in METRIC_CLASSES:
                    self.generic_visit(node)
                    return

                # Check both positional labelnames arg (3rd arg) and keyword
                label_lists = []
                if len(node.args) >= 3 and isinstance(node.args[2], ast.List):
                    label_lists.append(node.args[2])
                for kw in node.keywords:
                    if kw.arg == "labelnames" and isinstance(kw.value, ast.List):
                        label_lists.append(kw.value)

                for label_list in label_lists:
                    for elt in label_list.elts:
                        if not isinstance(elt, ast.Constant):
                            continue
                        label = str(elt.value)
                        for pattern in blocked_patterns:
                            if pattern.search(label):
                                self.violations.append(
                                    (node.lineno, func_name, label, pattern.pattern)
                                )

                self.generic_visit(node)

        violations = []
        files_scanned = 0

        for py_file in pathlib.Path(scan_path).rglob("*.py"):
            try:
                tree = ast.parse(py_file.read_text())
            except SyntaxError:
                continue
            files_scanned += 1
            checker = CardinalityChecker()
            checker.visit(tree)
            for lineno, metric, label, pattern in checker.violations:
                violations.append(
                    f"  {py_file}:{lineno} — "
                    f"'{metric}' uses label '{label}' "
                    f"(matches blocked pattern: {pattern})"
                )

        print(f"Cardinality Guard scanned {files_scanned} file(s).")

        if violations:
            print("\nFAILED — high-cardinality labels detected:\n")
            for v in violations:
                print(v)
            print(
                "\nThese labels produce one time series per unique value, "
                "causing Prometheus memory exhaustion at scale.\n"
                "Move the value to a log line or structured event instead."
            )
            sys.exit(1)

        print("PASSED — no high-cardinality label violations found.")
