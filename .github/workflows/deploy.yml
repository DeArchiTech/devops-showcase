name: Build → Scan → Deploy

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/dearchitech/devops-showcase

jobs:
  cardinality-guard:
    name: Check metric cardinality labels
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run cardinality guard
        uses: ./.github/actions/cardinality-guard

  build-and-push:
    name: Build Docker image and push to GHCR
    runs-on: ubuntu-latest
    needs: cardinality-guard
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    name: Rolling deploy to k3s
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write kubeconfig from secret
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config

      - name: Swap image tag to this commit SHA
        run: |
          sed -i 's|:latest|:${{ github.sha }}|g' k8s/apps/deployment.yaml

      - name: Apply app manifests
        run: kubectl apply -f k8s/apps/

      - name: Wait for rollout to complete
        run: kubectl rollout status deployment/signal-api --timeout=120s

      - name: Verify deployment is healthy
        run: kubectl get pods -l app=signal-api
