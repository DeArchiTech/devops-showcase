apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: monitoring
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
      - name: Loki
        type: loki
        url: http://loki.monitoring.svc.cluster.local:3100
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: default
        folder: DevOps Showcase
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: monitoring
data:
  signal-api.json: |
    {
      "title": "Signal API — RED Dashboard",
      "uid": "red-dashboard",
      "panels": [
        {
          "id": 1,
          "title": "Request Rate (req/s)",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [{ "expr": "rate(api_requests_total[1m])", "legendFormat": "{{endpoint}}" }],
          "gridPos": { "x": 0, "y": 0, "w": 8, "h": 8 }
        },
        {
          "id": 2,
          "title": "Error Rate (%)",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [{ "expr": "rate(api_requests_total{status=~'5..'}[1m]) / rate(api_requests_total[1m]) * 100", "legendFormat": "error %" }],
          "gridPos": { "x": 8, "y": 0, "w": 8, "h": 8 }
        },
        {
          "id": 3,
          "title": "p99 Latency (seconds)",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [{ "expr": "histogram_quantile(0.99, rate(api_request_duration_seconds_bucket[5m]))", "legendFormat": "p99" }],
          "gridPos": { "x": 16, "y": 0, "w": 8, "h": 8 }
        }
      ],
      "schemaVersion": 36,
      "version": 1
    }

  slo.json: |
    {
      "title": "Signal API — SLO Dashboard",
      "uid": "slo-dashboard",
      "panels": [
        {
          "id": 1,
          "title": "Success Rate (SLO: 99.9%)",
          "type": "stat",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "job:request_success_rate:rate5m * 100",
              "legendFormat": "Success Rate %"
            }
          ],
          "gridPos": { "x": 0, "y": 0, "w": 8, "h": 4 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 98,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red",    "value": null },
                  { "color": "yellow", "value": 99   },
                  { "color": "green",  "value": 99.9 }
                ]
              }
            }
          }
        },
        {
          "id": 2,
          "title": "Error Budget Remaining",
          "type": "stat",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "clamp_min((1 - (1 - job:request_success_rate:rate5m) / (1 - 0.999)) * 100, 0)",
              "legendFormat": "Budget %"
            }
          ],
          "gridPos": { "x": 8, "y": 0, "w": 8, "h": 4 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red",    "value": null },
                  { "color": "yellow", "value": 25   },
                  { "color": "green",  "value": 50   }
                ]
              }
            }
          }
        },
        {
          "id": 3,
          "title": "Burn Rate  (1× = on track  |  >1× = burning budget)",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "(1 - job:request_success_rate:rate5m) / (1 - 0.999)",
              "legendFormat": "Burn Rate"
            }
          ],
          "gridPos": { "x": 0, "y": 4, "w": 16, "h": 8 },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red",   "value": 1    }
                ]
              },
              "custom": {
                "thresholdsStyle": { "mode": "line" }
              }
            }
          }
        },
        {
          "id": 4,
          "title": "API Logs",
          "type": "logs",
          "datasource": "Loki",
          "targets": [
            {
              "expr": "{namespace=\"default\", app=\"signal-api\"}",
              "legendFormat": ""
            }
          ],
          "gridPos": { "x": 0, "y": 12, "w": 24, "h": 8 }
        }
      ],
      "schemaVersion": 36,
      "version": 1
    }

  synthetic.json: |
    {
      "title": "Synthetic Monitoring — External Probes",
      "uid": "synthetic-dashboard",
      "panels": [
        {
          "id": 1,
          "title": "Probe Success",
          "type": "stat",
          "datasource": "Prometheus",
          "targets": [
            { "expr": "probe_success{job=\"blackbox-http\"}", "legendFormat": "{{instance}}" }
          ],
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 6 },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red",   "value": null },
                  { "color": "green", "value": 1    }
                ]
              }
            }
          }
        },
        {
          "id": 2,
          "title": "Probe Duration (seconds) — end-to-end, as a real user sees it",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            { "expr": "probe_duration_seconds{job=\"blackbox-http\"}", "legendFormat": "{{instance}}" }
          ],
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 6 }
        },
        {
          "id": 3,
          "title": "Probe Uptime — last 24h (%)",
          "type": "stat",
          "datasource": "Prometheus",
          "targets": [
            { "expr": "avg_over_time(probe_success{job=\"blackbox-http\"}[24h]) * 100", "legendFormat": "{{instance}}" }
          ],
          "gridPos": { "x": 0, "y": 6, "w": 24, "h": 6 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 95,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red",    "value": null },
                  { "color": "yellow", "value": 99   },
                  { "color": "green",  "value": 99.9 }
                ]
              }
            }
          }
        }
      ],
      "schemaVersion": 36,
      "version": 1
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.0.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "showcase"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/signal-api.json
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasource
          configMap:
            name: grafana-datasource
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboard
          configMap:
            name: grafana-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
  type: LoadBalancer
