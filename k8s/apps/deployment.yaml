apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal-api
  labels:
    app: signal-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: signal-api
  template:
    metadata:
      labels:
        app: signal-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: signal-api
          image: ghcr.io/dearchitech/devops-showcase:latest
          ports:
            - containerPort: 8000
          # Delay traffic until /health returns 200 — prevents bad deploys
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: signal-api
  labels:
    app: signal-api
spec:
  selector:
    app: signal-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
---
# k3s's built-in LoadBalancer (klipper-lb) only binds the node's external IP
# to one Service per port, and Traefik already owns :80/:443 — so signal-api
# must be reached through Traefik's Ingress rather than its own LoadBalancer.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: signal-api
  labels:
    app: signal-api
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: signal-api
                port:
                  number: 80
